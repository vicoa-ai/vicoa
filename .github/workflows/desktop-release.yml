name: Desktop release

# Builds and publishes the desktop app to this repo's GitHub Releases
# (vicoa-ai/vicoa). electron-updater in the shipped app reads the resulting
# manifest from that repo to auto-update users — latest-mac.yml on macOS,
# latest.yml on Windows, latest-linux.yml on Linux. The three manifests are
# separate files, so all platforms share one release without clobbering each
# other's update feed.
#
#   macOS    Developer ID signed + notarized (required: Squirrel.Mac refuses to
#            APPLY an update whose code requirement doesn't match).
#   Windows  UNSIGNED (no cloud-HSM signing subscription set up). NSIS updates
#            still apply; users just see a SmartScreen prompt on first install.
#   Linux    UNSIGNED AppImage — the only Linux target electron-updater auto-
#            updates. No signing/notarize story on Linux at all.
#
# The jobs run STRICTLY SERIALLY (macos -> windows -> linux -> publish), never
# in parallel. Concurrent writers against the same draft release cause a
# duplicate-release race (two releases end up on the same tag); one two-arch
# electron-builder invocation is already one such writer, and adding a parallel
# job would make it worse. The serial chain costs a few extra minutes and buys a
# release that reconciles cleanly.
#
# Trigger: manual (Actions -> "Run workflow"), or push a `desktop-v*` tag.
# The version that ends up in the release comes from apps/desktop/package.json,
# so bump that first; the git tag is only a convenience trigger.
#
# Monorepo note: the desktop (Electron) project lives at apps/desktop/ and its
# renderer is the sibling apps/web/ app, so the renderer-install steps run in
# apps/web/ and the electron steps in apps/desktop/. stage-daemon
# (apps/desktop/scripts/stage-daemon.mjs) pulls the pinned daemon from the public
# npm registry (@vicoa/cli platform packages) — no GitHub release / token needed
# for the pull; it's the same source the app uses at runtime (cli-bootstrap.ts).
#
# Required repo secrets:
#   MAC_CERT_P12_BASE64      Developer ID Application cert + key, base64 .p12
#   MAC_CERT_PASSWORD        password for that .p12
#   APPLE_API_KEY_P8         App Store Connect API key (.p8 file contents)
#   APPLE_API_KEY_ID         e.g. ABC123DEF9
#   APPLE_API_ISSUER         e.g. 00000000-0000-0000-0000-000000000000
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY  (renderer build)
# Release publishing uses the built-in GITHUB_TOKEN (no PAT); the daemon pull
# needs no auth (public npm). The repo must allow Actions read/write for the
# workflow_run-based backend build to publish, though this push/dispatch
# workflow self-elevates.
# See apps/desktop/README.md "Auto-update / release" for setup details. The
# full release runbook (step-by-step, gotchas, troubleshooting) is an internal
# ops doc, not part of this repo.

on:
  workflow_dispatch:
    inputs:
      daemon_version:
        description: 'Override the pinned daemon version (blank = use the pin)'
        required: false
        default: ''
  push:
    tags: ['desktop-v*']

concurrency:
  group: desktop-release
  cancel-in-progress: false

# The built-in GITHUB_TOKEN publishes the release to this repo (electron-builder
# creates the DRAFT; the publish job un-drafts it). contents:write covers
# creating/uploading + editing the release. The daemon pull needs no token (npm).
# desktop-release is push/dispatch-triggered, so this block elevates the token
# even if the repo default is still read-only.
permissions:
  contents: write

jobs:
  macos:
    # Fork guard: this whole release pipeline runs only in the canonical repo, so
    # a fork that enables Actions and pushes a desktop-v* tag never attempts a
    # signed release with absent secrets. Upstream is always vicoa-ai/vicoa.
    if: github.repository == 'vicoa-ai/vicoa'
    # macOS 14 runners are Apple Silicon. electron-builder cross-packages the
    # x64 app here too (the x64 daemon is downloaded by stage-daemon; the
    # notification helper is a universal binary), so this ONE job emits both
    # arm64 + x64 in a single electron-builder invocation — required to keep
    # both archs listed in one latest-mac.yml (two runs would clobber it).
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install web deps (for the renderer build)
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Install electron deps
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Write App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "${{ secrets.APPLE_API_KEY_P8 }}" > "$RUNNER_TEMP/private_keys/AuthKey.p8"

      - name: Package, sign, notarize & publish (draft)
        working-directory: apps/desktop
        # stage:daemon (inside package:release) downloads + bundles the pinned
        # daemon (apps/desktop/package.json "vicoaDaemonVersion") from the public
        # npm registry — the same mechanism as a local build, and the same source
        # the app uses at runtime. No separate download step, one source of truth.
        #
        # De-bundling (ship without the daemon, download it on first run) is
        # available via VICOA_DEBUNDLE_DAEMON=1 but intentionally NOT enabled —
        # the app ships bundled for a reliable, offline first run.
        env:
          VICOA_MAC_RELEASE: '1'
          # Override the pinned daemon version for this run (blank = the pin).
          VICOA_DAEMON_VERSION: ${{ github.event.inputs.daemon_version }}
          # Developer ID signing — electron-builder imports the .p12 into a
          # throwaway keychain from these two on its own.
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          # Notarization via App Store Connect API key (reuses the mobile key).
          APPLE_API_KEY: ${{ runner.temp }}/private_keys/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # electron-builder publishes the DRAFT release to this repo via this
          # token; the daemon pull uses public npm (no token).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Renderer build env (build-renderer.mjs bakes NEXT_PUBLIC_* at build
          # time; next build also needs a POSTGRES_URL to satisfy module init).
          # Add any other NEXT_PUBLIC_* / server vars your build requires.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # PostHog analytics for the desktop app. Optional at build time
          # (instrumentation-client.ts skips init when absent), so an unset
          # secret degrades to no-telemetry instead of failing the build.
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ secrets.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
          POSTGRES_URL: postgres://127.0.0.1:1/desktop-ci-unused
          # The Stripe client is built at module scope (lib/payments/stripe.ts),
          # and `next build` evaluates it while collecting page data for the
          # /api/stripe/* routes. The desktop app never calls those routes
          # (checkout opens the web app externally), so placeholders satisfy the
          # build without a real key — build-renderer's sanitized bundle .env
          # carries only NEXT_PUBLIC_* + POSTGRES_URL, so STRIPE_* never ships.
          STRIPE_SECRET_KEY: sk_test_desktop_ci_unused
          STRIPE_WEBHOOK_SECRET: whsec_desktop_ci_unused
        run: pnpm run package:release

  windows:
    # Serial after macOS on purpose (see the header): both jobs upload into the
    # SAME draft release, and concurrent writers duplicate it.
    needs: macos
    if: github.repository == 'vicoa-ai/vicoa'  # fork guard (see macos)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install web deps (for the renderer build)
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Install electron deps
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Package & publish (draft)
        working-directory: apps/desktop
        # No signing env: the Windows build is deliberately unsigned. Everything
        # else mirrors the macOS job — stage:daemon pulls the pinned daemon from
        # npm (@vicoa/cli win32-x64), and the renderer build needs the same
        # NEXT_PUBLIC_* + build-only placeholders. See the macOS job above for
        # why each one is here.
        #
        # De-bundling is available via VICOA_DEBUNDLE_DAEMON=1 but NOT enabled —
        # the app ships bundled.
        env:
          VICOA_DAEMON_VERSION: ${{ github.event.inputs.daemon_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ secrets.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
          POSTGRES_URL: postgres://127.0.0.1:1/desktop-ci-unused
          STRIPE_SECRET_KEY: sk_test_desktop_ci_unused
          STRIPE_WEBHOOK_SECRET: whsec_desktop_ci_unused
        run: pnpm run package:win:release

  linux:
    # Serial after Windows on purpose (see the header): every build job uploads
    # into the SAME draft release, and concurrent writers duplicate it.
    needs: windows
    if: github.repository == 'vicoa-ai/vicoa'  # fork guard (see macos)
    # Pinned to 22.04 (glibc 2.35), NOT ubuntu-latest: electron + the AppImage
    # link against the builder's glibc, so the runner sets the MINIMUM glibc of
    # any machine that can launch the app. Keep this in lockstep with the backend
    # daemon build (.github/workflows/backend-build-binaries.yml `build-linux`) —
    # the effective floor is the NEWER of the two glibcs, so a mismatch silently
    # raises it. NB: the shipped floor only actually drops once the pinned
    # `vicoaDaemonVersion` points at a daemon built on this runner.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install web deps (for the renderer build)
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Install electron deps
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Package & publish (draft)
        working-directory: apps/desktop
        # UNSIGNED AppImage — no signing env (Linux has no signing story). Builds
        # an AppImage + latest-linux.yml and uploads into the shared draft.
        # stage:daemon pulls the pinned daemon from npm (@vicoa/cli linux-x64);
        # the renderer build needs the same NEXT_PUBLIC_* + build-only
        # placeholders as the other jobs.
        #
        # De-bundling is available via VICOA_DEBUNDLE_DAEMON=1 but NOT enabled —
        # the app ships bundled.
        env:
          VICOA_DAEMON_VERSION: ${{ github.event.inputs.daemon_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ secrets.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
          POSTGRES_URL: postgres://127.0.0.1:1/desktop-ci-unused
          STRIPE_SECRET_KEY: sk_test_desktop_ci_unused
          STRIPE_WEBHOOK_SECRET: whsec_desktop_ci_unused
        run: pnpm run package:linux:release

  publish:
    # Only after ALL platforms have finished uploading.
    needs: [macos, windows, linux]
    if: github.repository == 'vicoa-ai/vicoa'  # fork guard (see macos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need the tag history to compute the previous desktop release

      - name: Publish the release (un-draft) with auto-generated notes
        # electron-builder uploaded the assets to a DRAFT release tagged
        # v<version> in vicoa-ai/vicoa. Flip it live only now that every asset from
        # every platform finished uploading, so the updater never sees a
        # half-built release. Set the body to GitHub's auto-generated, PR-based
        # notes (grouped per .github/release.yml). `gh release edit` has no
        # --generate-notes, so call the REST generate-notes endpoint first, then
        # set the body. previous_tag_name uses the unambiguous desktop-v* trigger
        # tag — NOT the shared v* release namespace the daemon tooling historically
        # tagged into — so the PR range is always the prior DESKTOP release.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          TAG="v$VERSION"
          PREV=$(git tag --list 'desktop-v*' --sort=-version:refname \
                   | grep -vx "desktop-v$VERSION" | head -n1 || true)
          echo "Publishing $TAG to vicoa-ai/vicoa (previous desktop tag: ${PREV:-<none>})"
          if [ -n "$PREV" ]; then
            BODY=$(gh api -X POST repos/vicoa-ai/vicoa/releases/generate-notes \
                     -f tag_name="$TAG" -f previous_tag_name="$PREV" --jq .body)
          else
            BODY=$(gh api -X POST repos/vicoa-ai/vicoa/releases/generate-notes \
                     -f tag_name="$TAG" --jq .body)
          fi
          printf '%s' "$BODY" | gh release edit "$TAG" \
            --repo vicoa-ai/vicoa \
            --draft=false \
            --latest \
            --notes-file -
