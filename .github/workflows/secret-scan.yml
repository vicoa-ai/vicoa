name: Secret Scan

# Detection net for secrets that slip past the local gitleaks pre-commit hook.
# Runs on every PR and on push to main. Scans the checked-out working tree at
# HEAD — a lint checkout installs no dependencies, so the tree is just tracked
# files (no node_modules / Pods / build noise). It does NOT scan git history, so
# it will not fail on secrets that only exist in old commits; those are handled
# by the pre-open-source history cleanup. Uses the repo-root .gitleaks.toml
# (publishable client keys and lock files are allowlisted there).
#
# Note: this is a net, not prevention — by the time CI runs, the commit is
# already on the remote. Real prevention is the local pre-commit hook plus, once
# public, GitHub Push Protection. If a real secret ever reaches here: rotate it.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          VERSION=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan working tree for secrets
        run: gitleaks dir . --config .gitleaks.toml --no-banner --redact
