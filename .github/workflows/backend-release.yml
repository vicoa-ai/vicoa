name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: "Publish to Test PyPI (manual run)"
        type: boolean
        default: false
        required: false
      publish_pypi:
        description: "Publish to PyPI (manual run)"
        type: boolean
        default: false
        required: false

permissions:
  contents: write

# Monorepo: all run steps execute inside backend/. Note that
# `uses:` action inputs (cache/artifact `path:`, `hashFiles()`) are
# ALWAYS workspace-relative and are prefixed with backend/ below.
defaults:
  run:
    working-directory: backend

jobs:
  release:
    # Fork guard: the release/publish jobs run only in the canonical repo. A
    # fork that enables Actions and syncs `v*` tags would otherwise fire this
    # and fail (no secrets, no publish rights). Upstream is always vicoa-ai/vicoa.
    if: github.repository == 'vicoa-ai/vicoa'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      # The package is pure Python, so one sdist + one py3-none-any wheel
      # covers every platform. (Until 1.9.18 the wheels carried a ~100 MB Codex
      # binary per platform and were built in a separate codex_wheels job.)
      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions
        run: twine check dist/*

      - name: Extract version (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      # NOTE: the CLI intentionally does NOT create a GitHub release. The daemon
      # is distributed via npm (@vicoa/cli) + PyPI (vicoa); the desktop build
      # pulls the frozen daemon from npm (apps/desktop/scripts/stage-daemon.mjs),
      # and the runtime download does too (apps/desktop/src/cli-bootstrap.ts). The
      # only GitHub release page is the desktop one (desktop-release.yml). A `v*`
      # tag therefore publishes to npm + PyPI only — see also the removed
      # `create-release` release step in backend-build-binaries.yml.

      # PyPI publish is blocking: a failure fails this run, which also holds
      # back Build Binaries (it triggers on this run's success and ships npm).
      # It used to be continue-on-error because the codex wheels kept hitting
      # PyPI's 10 GB project cap, which left 1.9.14-1.9.16 silently missing
      # from PyPI behind a green run. The wheel is now a few MB, so a failure
      # is a real problem worth stopping for. --skip-existing keeps a re-run
      # of the same tag idempotent.
      # Test PyPI publish disabled: the test-pypi 'vicoa' project has the same
      # 10 GB per-project storage cap and is effectively full, so this step just
      # 400s and adds noise. Re-enable if you need a staging upload; you'll
      # likely have to prune old test-pypi releases first.
      # - name: Publish to Test PyPI
      #   if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_testpypi == 'true')
      #   continue-on-error: true
      #   env:
      #     TWINE_USERNAME: __token__
      #     TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
      #   run: |
      #     twine upload --verbose --repository testpypi dist/*

      - name: Publish to PyPI
        if: (startsWith(github.ref, 'refs/tags/') && !contains(github.ref, 'alpha') && !contains(github.ref, 'beta') && !contains(github.ref, 'rc')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_pypi == 'true')
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload --verbose --skip-existing dist/*
