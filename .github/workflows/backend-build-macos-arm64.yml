name: Build macOS arm64 Binary

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-arm64:
    runs-on: macos-15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c src/shared/requirements.txt -e .
          pip install pyinstaller

      - name: Build binary
        run: |
          cd pyinstaller
          pyinstaller vicoa.spec

      - name: Test binary
        run: |
          ./pyinstaller/dist/vicoa/vicoa --version
          ./pyinstaller/dist/vicoa/vicoa --help

      - name: Smoke test subcommand imports
        run: python scripts/smoke_test_binary.py ./pyinstaller/dist/vicoa/vicoa

      - name: Extract version
        id: get_version
        run: echo "VERSION=0.0.0-dev.$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Package binary
        run: |
          cd pyinstaller/dist
          zip -r vicoa-macos-arm64.zip vicoa/

      - name: Build npm package
        run: |
          python scripts/build_npm_package.py \
            --platform darwin-arm64 \
            --dist-dir pyinstaller/dist/vicoa \
            --version ${{ steps.get_version.outputs.VERSION }} \
            --output dist/npm

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: vicoa-macos-arm64
          path: backend/pyinstaller/dist/vicoa-macos-arm64.zip
          retention-days: 7

      - name: Upload npm artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-darwin-arm64
          path: backend/dist/npm/cli-darwin-arm64/
          retention-days: 7
