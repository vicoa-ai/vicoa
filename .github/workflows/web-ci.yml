name: Web CI

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-ci.yml'

# Least privilege: CI only needs to read the repo. Pinned here so these jobs stay
# read-only even after the repo default workflow permission is set to read/write
# (that write default exists only for the release workflows).
permissions:
  contents: read

defaults:
  run:
    working-directory: apps/web

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest
        run: pnpm test
