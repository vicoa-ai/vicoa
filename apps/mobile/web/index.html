<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    Alternatively, build your application passing the --base-href parameter
    specifying the new root path of your web app.

    Fore more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Vicoa">

  

  <meta name="robots" content="noindex" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <!-- Open Graph & SEO tags -->
  <meta property="og:title" content="Vicoa - Vibe Code Anywhere | AI Coding on Mobile" />
  <meta property="og:description" content="Never stop coding, even when you're away from your desk. Vicoa brings Claude Code to your mobile device for seamless AI-assisted development anywhere." />
  <meta property="og:image" content="https://storage.googleapis.com/flutterflow-prod-hosting/og_splash_gradient.png" /> 
  <meta name="twitter:title" content="Vicoa - Vibe Code Anywhere | AI Coding on Mobile" />
  <meta name="twitter:description" content="Continue your development workflow on mobile. Get Claude Code notifications, delegate tasks, and stay productive anywhere with Vicoa." />
  <meta name="twitter:image" content="https://storage.googleapis.com/flutterflow-prod-hosting/og_splash_gradient.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <title>Vicoa - Vibe Code Anywhere | AI Coding Assistant for Mobile</title>
  <meta name="description" content="The mobile AI coding assistant that brings Claude Code to your phone. Continue coding, get notifications, and delegate tasks anywhere. Never be tied to your desk again." />
  <meta name="keywords" content="AI coding, mobile development, Claude Code, vibe coding, code assistant, mobile productivity, developer tools, AI assistant" />
    

  <!-- Status Bar color in Safari browser (iOS) and PWA -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1f4f8">
  <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#1d2428">

  <link rel="manifest" href="manifest.json">
  
</head>
<body>
  
  
  
  
  
  <script>
    {{flutter_bootstrap_js}}
  </script>
</body>
</html>
